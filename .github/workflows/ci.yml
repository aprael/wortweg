# Prüfungen bei jedem Push und Pull Request: Lint, Kursvalidierung, Unit-/Servertests, End-to-End gegen den echten Server.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm run e2e
      - run: npm run build:app
