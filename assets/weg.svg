<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <!-- Illustration „Wortweg“: geschwungener Weg mit Wegmarken, Ziel-Fahne und zwei Sprechblasen.
       Eigenes Werk, selbst gezeichnet für Wortweg (2026), Lizenz CC0 1.0. Keine fremden Vorlagen oder Maskottchen. -->
  <style>
    .bg { fill: #dbe7ff; }
    .hill { fill: #c9d9fb; }
    .road { fill: none; stroke: #2459dc; stroke-width: 18; stroke-linecap: round; }
    .dash { fill: none; stroke: #ffffff; stroke-width: 3; stroke-dasharray: 8 10; stroke-linecap: round; }
    .mark { fill: #ffffff; stroke: #2459dc; stroke-width: 4; }
    .done { fill: #0f766e; stroke: #ffffff; stroke-width: 3; }
    .flag { fill: #ffc32b; }
    .pole { stroke: #0d1b46; stroke-width: 4; stroke-linecap: round; }
    .b1 { fill: #ffffff; stroke: #2459dc; stroke-width: 3; }
    .b2 { fill: #ffc32b; }
    .line1 { stroke: #2459dc; stroke-width: 4; stroke-linecap: round; }
    .line2 { stroke: #5a2a00; stroke-width: 4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c2c5c; }
      .hill { fill: #24376e; }
      .road { stroke: #4f8cff; }
      .mark { stroke: #4f8cff; fill: #15224a; }
      .pole { stroke: #eef3ff; }
      .b1 { fill: #15224a; stroke: #4f8cff; }
      .line1 { stroke: #bcd2ff; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="360" height="260" rx="28"/>
